# Settings for examples/plate.svg and examples/plate.dxf: a plate with a hole and a panel to engrave.
# Try them with:  phoenix-laser cut examples/plate.svg plate.nc --config examples/plate.cfg
# A line that starts with # is a note. Every value is checked when the file is read.

[machine]
# the spindle value that is full power for the controller ($30 of GRBL)
s_max = 1000
# how far the head runs past the end of a hatch line, so that it is at speed when the laser is on
overscan_mm = 2

[defaults]
# what a layer that is not named below gets
mode = cut
power = 40
speed = 600

# the red lines of the SVG and the layer CUT of the DXF
[layer #ff0000]
mode = cut
power = 90
speed = 300
passes = 2
# the focus moves 0.1 mm down at each pass
focus_step = -0.1
# the beam is 0.15 mm wide: outside the plate and inside the hole, so that both keep their size
kerf = 0.15
kerf_side = auto
# two bridges of 1.5 mm on the outline so that the plate does not fall
tabs = 2
tab_width = 1.5

[layer cut]
mode = cut
power = 90
speed = 300
passes = 2
focus_step = -0.1
kerf = 0.15
kerf_side = auto
tabs = 2
tab_width = 1.5

# the blue panel of the SVG and the layer MARK of the DXF: filled with lines at 45 degrees
[layer #0000ff]
mode = engrave
power = 25
speed = 1500
hatch_angle = 45
hatch_spacing = 0.2

[layer mark]
mode = engrave
power = 25
speed = 1500
hatch_angle = 45
hatch_spacing = 0.2
