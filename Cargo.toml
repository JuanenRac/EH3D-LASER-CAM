[package]
name = "eh3d-phoenix-laser"
version = "0.0.3"
edition = "2021"
rust-version = "1.75"
description = "Laser engraving from an image: dithering (threshold, Floyd-Steinberg, Atkinson), raster G-code with dynamic power and overscan, and a power-against-feed calibration grid"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-LASER"
readme = "README.md"

[lib]
name = "eh3d_phoenix_laser"
path = "src/lib.rs"

[[bin]]
name = "phoenix-laser"
path = "src/main.rs"

[dependencies]
# the reader of PGM and PNG pictures, shared with the other programs that work from a picture
eh3d-image = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/image" }

[dev-dependencies]
# the tests make their own PNG files
png = "0.17"

[profile.release]
opt-level = 3
lto = true
